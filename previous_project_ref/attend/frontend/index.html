<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/styles.css?v=6">
</head>
<body class="login-body">
    <!-- Background Enhancement -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <nav class="navbar fade-in-up" style="animation-delay: 0s;">
        <div class="logo">
            <i class="fa-solid fa-face-smile-beam"></i> Smart Attendance
        </div>
        <div class="nav-links" style="display:flex; align-items:center;">
            <button id="themeToggle" class="btn btn-secondary" style="margin-right: 1rem; border-radius:50%; width:40px;height:40px;padding:0;" onclick="toggleTheme()" title="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="/" class="active">Recognition</a>
            <a href="/dashboard">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="split-layout">
            <!-- Video Feed Section -->
            <div class="card glass-card fade-in-up" style="animation-delay: 0.1s;">
                <h2><i class="fa-solid fa-camera"></i> Live Camera Feed</h2>
                <div class="video-container" style="background: #000; position: relative;">
                    <img src="" alt="Camera Offline" id="videoFeed" style="display: none; width: 100%;">
                    <div id="cameraPlaceholder" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; color: var(--text-secondary);">
                        <i class="fa-solid fa-camera-slash" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <p>Camera is currently offline</p>
                        <button class="btn btn-primary" onclick="startRecognitionSession()" style="margin-top: 1rem;">
                            <i class="fa-solid fa-play"></i> Start Recognition
                        </button>
                    </div>
                </div>
            </div>

            <!-- Registration Section -->
            <div class="card glass-card fade-in-up" style="animation-delay: 0.2s;">
                <h2><i class="fa-solid fa-user-plus"></i> New Student Registration</h2>
                <form id="registrationForm" onsubmit="submitRegistration(event)">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="name" placeholder="John Doe" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="usn">USN / Student ID</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-id-card"></i>
                            <input type="text" id="usn" placeholder="1XX20CS001" required>
                        </div>
                    </div>
                    <button type="submit" id="regButton" class="btn btn-primary btn-block" onclick="createRipple(event)">
                        <i class="fa-solid fa-camera-retro"></i> <span class="btn-text">Capture & Register</span>
                        <div class="spinner"></div>
                    </button>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 1rem;">
                        <i class="fa-solid fa-circle-info"></i> Note: When you click register, please face the camera directly. The system will capture 8 frames to create your profile.
                    </p>
                </form>
                <div id="regMessage" style="margin-top: 1rem; font-weight: 500;"></div>
            </div>
        </div>
    </div>

    <!-- Audio for notifications -->
    <audio id="successSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div id="toast" class="toast"></div>

    <script src="/static/script.js?v=6"></script>
</body>
</html>
